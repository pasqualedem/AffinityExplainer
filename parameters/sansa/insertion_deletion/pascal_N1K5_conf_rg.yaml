grid: SANSA_pascal_N1K5_conf_rg
parameters:
  model:
  - sansa
  cache:
  - false
  explainer:
    name:
    - random
    - gaussian_noise
  explanation_masking:
  - logits
  log_frequency:
  - 50
  disable_iauc:
  - false
  disable_dauc:
  - true
  metric:
    n_steps:
    - 75
    substrate_fn:
    - zero
    measure:
    - logits
    percentage:
    - 0.01
    skip_empty:
    - true
  dataset:
    datasets:
      val_pascal5i_N1K5:
        name:
        - pascal
        data_dir:
        - data/pascal
        split:
        - val
        val_fold_idx:
        - null
        n_folds:
        - 4
        n_shots:
        - 5
        n_ways:
        - 1
        do_subsample:
        - false
        val_num_samples:
        - 1000
        maintain_gt_shape:
        - false
    common:
      remove_small_annotations:
      - true
      custom_preprocess:
      - false
      maintain_gt_shape:
      - false
  dataloader:
    num_workers:
    - 8
    batch_size:
    - 1
    csv_folder:
    - data_csv
    num_processes:
    - 16
other_grids: null
