grid: Computation_VFM_N1K5

parameters:
  model: [insid3]
  explainer:
    name: [lime, affinity, signed_affinity]

  explanation_size: [64]

  explanation_masking: [logits]
  num_steps: [100]
  warmup_steps: [10]

  dataset:
    datasets:
      val_coco20i_N1K5:
        name: [coco]
        instances_path: [data/coco/annotations/instances_val2014.json]
        all_example_categories: [False]
        img_dir: [data/coco/train_val_2017]
        n_shots: [5]
        n_ways: [1]
        do_subsample: [False]
        add_box_noise: [False]
        val_fold_idx: [null]
        n_folds: [null]
        split: ["val"]
    common:
      remove_small_annotations: [True]
      custom_preprocess: [False]
      maintain_gt_shape: [False]
  dataloader:
    num_workers: [8]
    batch_size: [1]
    csv_folder: [data_csv]

other_grids:
  - model: [sansa]
    explainer:
      name: [saliency, integrated_gradients, guided_ig, blur_ig, xrai, lime, affinity, signed_affinity]
