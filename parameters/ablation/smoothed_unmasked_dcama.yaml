grid: SmoothedUnmaskedControl_DCAMA_N1K5

# Reviewer ynLC control: does the masked variant's gain come from smoothing (interior
# concentration) rather than from the support-mask sign? All three arms share the SAME
# Gaussian blur so "smoothed unmasked" is an equally-smoothed version of unmasked AffEx.
#   affinity          -> unmasked, no smoothing
#   smoothed_affinity -> unmasked + blur (the control)
#   signed_affinity   -> sign + dilation + blur (masked, main variant)

parameters:
  model: [dcama]
  cache: [False]
  explainer:
    name: [affinity, smoothed_affinity, signed_affinity]
    mask_blur_kernel_size: [7]
    mask_blur_sigma: [50]
    mask_dilation_radius: [5]
    mask_dilation_kernel: [7]

  explanation_masking: [logits]
  log_frequency: [50]
  disable_dauc: [True]

  metric:
    n_steps: [1]
    substrate_fn: [zero]
    percentage: [0.01, 0.05]
    measure: [miou]
    loss: [True]
    skip_empty: [True]

  dataset:
    datasets:
      val_pascal5i_N1K5_200:
        name: [pascal]
        data_dir: &instance_dir [data/pascal]
        split: ["val"]
        val_fold_idx: [null]
        n_folds: [4]
        n_shots: [5]
        n_ways: [1]
        do_subsample: [False]
        val_num_samples: [200]
        maintain_gt_shape: [False]
    common:
      remove_small_annotations: [True]
      custom_preprocess: [False]
      maintain_gt_shape: [False]
  dataloader:
    num_workers: [8]
    batch_size: [1]
    csv_folder: [data_csv]

other_grids:
