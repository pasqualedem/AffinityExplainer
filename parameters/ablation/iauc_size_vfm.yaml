grid: SizeAblationVFM

parameters:
  model: [insid3]
  explainer:
    name: [affinity]
    explanation_size: [32, 64, 128, 256]

  explanation_masking: [logits]
  log_frequency: [0]
  disable_dauc: [True]

  metric:
    n_steps: [1]
    substrate_fn: [zero]
    percentage: [0.01]
    measure: [miou]
    loss: [True]
    skip_empty: [True]

  dataset:
    datasets:
      val_pascal5i_N1K5:
        name: [pascal]
        data_dir: [data/pascal]
        split: ["val"]
        val_fold_idx: [null]
        n_folds: [4]
        n_shots: [5]
        n_ways: [1]
        do_subsample: [False]
        val_num_samples: [1000]
        maintain_gt_shape: [False]
    common:
      remove_small_annotations: [True]
      ignore_borders: [True]
      custom_preprocess: [False]
  dataloader:
    num_workers: [8]
    batch_size: [1]
    csv_folder: [data_csv]

other_grids:
  - model: [sansa]
