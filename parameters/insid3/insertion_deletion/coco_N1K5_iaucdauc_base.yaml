grid: INSID3_coco_iaucdauc_base
parameters:
  model:
  - insid3
  cache:
  - false
  explainer:
    name:
    - random
    - gaussian_noise
  explanation_masking:
  - logits
  log_frequency:
  - 50
  disable_iauc:
  - false
  disable_dauc:
  - false
  metric:
    n_steps:
    - 75
    substrate_fn:
    - zero
    measure:
    - miou
    skip_empty:
    - true
  dataset:
    datasets:
      val_coco20i_N1K5:
        name:
        - coco
        instances_path:
        - data/coco/annotations/instances_val2014.json
        all_example_categories:
        - false
        img_dir:
        - data/coco/train_val_2017
        n_shots:
        - 5
        n_ways:
        - 1
        do_subsample:
        - false
        add_box_noise:
        - false
        val_fold_idx:
        - null
        n_folds:
        - null
        split:
        - val
    common:
      remove_small_annotations:
      - true
      custom_preprocess:
      - false
      maintain_gt_shape:
      - false
  dataloader:
    num_workers:
    - 8
    batch_size:
    - 1
    csv_folder:
    - data_csv
    num_processes:
    - 16
other_grids: null
