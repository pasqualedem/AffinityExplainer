grid: INSID3_mIoULoss_N1K1_100_baseline

parameters:
  model: [insid3]
  cache: [False]
  explainer:
    name: [gaussian_noise, random]

  explanation_masking: [logits]
  log_frequency: [50]
  disable_iauc: [False]
  disable_dauc: [True]

  metric:
    n_steps: [1]
    substrate_fn: [zero]
    percentage: [0.01, 0.05]
    measure: [miou]
    loss: [True]
    skip_empty: [True]

  dataset:
    datasets:
      val_pascal5i_N1K1_100:
        name: [pascal]
        data_dir: &instance_dir [data/pascal]
        split: ["val"]
        val_fold_idx: [null]
        n_folds: [4]
        n_shots: [1]
        n_ways: [1]
        do_subsample: [False]
        val_num_samples: [100]
        maintain_gt_shape: [False]
    common:
      remove_small_annotations: [True]
      custom_preprocess: [False]
      maintain_gt_shape: [False]
  dataloader:
    num_workers: [4]
    batch_size: [1]
    csv_folder: [data_csv]

other_grids:
