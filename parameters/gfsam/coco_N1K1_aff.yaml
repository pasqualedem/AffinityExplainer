grid: GFSAM_coco_N1K1_aff
parameters:
  model:
  - gfsam
  cache:
  - false
  explainer:
    name:
    - affinity
    - signed_affinity
    explanation_size:
    - 37
    mask_blur_kernel_size:
    - 7
    mask_blur_sigma:
    - 50
    mask_dilation_radius:
    - 5
    mask_dilation_kernel:
    - 7
  explanation_masking:
  - logits
  log_frequency:
  - 50
  disable_iauc:
  - false
  disable_dauc:
  - true
  metric:
    n_steps:
    - 1
    substrate_fn:
    - zero
    percentage:
    - 0.01
    - 0.05
    measure:
    - miou
    loss:
    - true
    skip_empty:
    - true
  dataset:
    datasets:
      val_coco20i_N1K1:
        name:
        - coco
        instances_path:
        - data/coco/annotations/instances_val2014.json
        all_example_categories:
        - false
        img_dir:
        - data/coco/train_val_2017
        n_shots:
        - 1
        n_ways:
        - 1
        do_subsample:
        - false
        add_box_noise:
        - false
        val_fold_idx:
        - null
        n_folds:
        - null
        split:
        - val
    common:
      remove_small_annotations:
      - true
      custom_preprocess:
      - false
      maintain_gt_shape:
      - false
  dataloader:
    num_workers:
    - 8
    batch_size:
    - 1
    csv_folder:
    - data_csv
other_grids: null
