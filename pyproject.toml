[project]
name = "affinityexplainer"
version = "0.1.0"
description = "Support-side attribution for matching-based few-shot semantic segmentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "captum>=0.8.0",
    "colorlog>=6.9.0",
    "einops>=0.8.1",
    "gdown>=5.2.0",          # the DCAMA and DMTNet weights are published on Google Drive
    # SANSA builds SAM2 through hydra.
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "lovely-tensors>=0.1.18",
    "opencv-python>=4.11.0.86",
    "pot>=0.9.5",            # optimal transport, used by Matcher
    "py3-wget>=1.0.0",       # fetcher used by the DINOv3 hub code
    "pycocotools>=2.0.8",
    "pyyaml>=6.0.2",
    "safetensors>=0.5.3",
    "saliency>=0.2.1",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.6.1",
    "streamlit>=1.44.1",
    "streamlit-drawable-canvas==0.9.3",
    "termcolor>=2.4.0",      # imported by the DINOv3 hub code INSID3 loads
    "timm>=1.0.15",
    "torch>=2.6.0",
    "torchmetrics>=1.7.1",
    "torchvision>=0.21.0",
    "wandb>=0.20.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["affex*"]


[project.scripts]
app = "affex.app:launch"